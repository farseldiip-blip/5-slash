<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="title1 desc1">
  <title id="title1">FIVE SLASH — Menu Page 1</title>
  <desc id="desc1">Replace this file with your actual menu image (menu-1.jpg). Keep the filename or update the src in menu.html.</desc>
  <rect width="800" height="1100" fill="#FAF9F9"/>
  <rect x="24" y="24" width="752" height="1052" fill="none" stroke="#1B1C1C" stroke-width="1.5" opacity="0.12"/>
  <!-- slash accent -->
  <g opacity="0.08"><rect x="-200" y="500" width="1200" height="1.5" fill="#AD2C00" transform="rotate(45 400 550)"/></g>
  <text x="400" y="140" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#1B1C1C">FIVE SLASH</text>
  <text x="400" y="172" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" letter-spacing="0.14em" fill="#5F5E5E">PAGE 01 — ESPRESSO &amp; FILTER</text>
  <line x1="360" y1="196" x2="440" y2="196" stroke="#AD2C00" stroke-width="2"/>
  <!-- items -->
  <g font-family="Hanken Grotesk, sans-serif" fill="#1B1C1C">
    <text x="80" y="300" font-size="22" font-weight="700">POUR OVER <tspan font-family="Geist, sans-serif" font-size="11" fill="#5D4038" dx="8">SINGLE ORIGIN — $6.00</tspan></text>
    <text x="80" y="330" font-family="Inter, sans-serif" font-size="13" fill="#5F5E5E">Rotating single-origin, brewed to order.</text>
    <text x="80" y="400" font-size="22" font-weight="700">ESPRESSO <tspan font-family="Geist, sans-serif" font-size="11" fill="#5D4038" dx="8">$4.00</tspan></text>
    <text x="80" y="430" font-family="Inter, sans-serif" font-size="13" fill="#5F5E5E">Double shot — house blend.</text>
    <text x="80" y="500" font-size="22" font-weight="700">CORTADO <tspan font-family="Geist, sans-serif" font-size="11" fill="#5D4038" dx="8">$4.50</tspan></text>
    <text x="80" y="530" font-family="Inter, sans-serif" font-size="13" fill="#5F5E5E">Equal parts espresso &amp; textured milk.</text>
    <text x="80" y="600" font-size="22" font-weight="700">LATTE <tspan font-family="Geist, sans-serif" font-size="11" fill="#5D4038" dx="8">$5.50</tspan></text>
    <text x="80" y="630" font-family="Inter, sans-serif" font-size="13" fill="#5F5E5E">Double ristretto, creamy milk.</text>
  </g>
  <text x="400" y="1020" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" letter-spacing="0.1em" fill="#926F66">REPLACE WITH menu-1.jpg — SEE public/assets/images/menu/README.md</text>
</svg>
